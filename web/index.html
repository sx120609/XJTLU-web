    <meta name="apple-mobile-web-app-title" content="靠浦" />
    <meta name="application-name" content="靠浦" />
    <script>
      (() => {
        const localeKey = "kaopu-locale";
        let locale = "en-US";
        try {
          if (localStorage.getItem(localeKey) === "zh-CN") locale = "zh-CN";
        } catch {}
        const root = document.documentElement;
        root.lang = locale;
        root.dataset.locale = locale;

        const storageKey = "kaopu-appearance-mode-v2";
        let mode = "light";
        try {
          const stored = localStorage.getItem(storageKey);
          if (stored === "light" || stored === "dark") mode = stored;
        } catch {}
        root.dataset.theme = mode;
        root.dataset.appearanceMode = mode;
        root.classList.toggle("dark", mode === "dark");
        root.style.colorScheme = mode;
        const themeColor = document.querySelector("meta[name='theme-color']");
        if (themeColor) themeColor.setAttribute("content", mode === "dark" ? "#8B7CF6" : "#6D5CE7");
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #edf4ff;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
      }
      body:not([data-cpu-app-ready="1"]) {
        overflow: hidden;
      }
      #app {
        min-height: 100vh;
        min-height: 100dvh;
      }
      .app-launch-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background:
          radial-gradient(circle at 18% 0%, rgba(174, 211, 255, 0.56), transparent 30%),
          radial-gradient(circle at 88% 14%, rgba(183, 232, 219, 0.42), transparent 28%),
          linear-gradient(180deg, #edf4ff 0%, #f7fbff 42%, #f8fafc 100%);
        color: #172033;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        pointer-events: none;
        z-index: 0;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }
      body[data-cpu-app-ready="1"] .app-launch-screen {
        opacity: 0;
        visibility: hidden;
      }
      html[data-locale="en-US"] .launch-zh,
      html[data-locale="zh-CN"] .launch-en {
        display: none;
      }
      .app-launch-logo {
        width: 84px;
        height: 84px;
        border-radius: 0;
        display: block;
        border-radius: 20px;
        box-shadow: 0 14px 36px rgba(109, 92, 231, 0.24);
      }
      .app-launch-title {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
        font-weight: 800;
        letter-spacing: 0;
      }
      .app-launch-subtitle {
        margin: 0;
        font-size: 15px;
        line-height: 1.45;
        color: #667085;
      }
      html[data-theme="dark"] body {
        background: #07110f;
      }
      html[data-theme="dark"] .app-launch-screen {
        background: linear-gradient(180deg, #07110f 0%, #0b1715 48%, #101816 100%);
        color: #e5f4f1;
      }
      html[data-theme="dark"] .app-launch-subtitle {
        color: #8ea6a0;
      }
      html[data-theme="dark"] .app-launch-logo {
        box-shadow: 0 14px 42px rgba(139, 124, 246, 0.2);
      }
    </style>
    <title>Kaopu · Reimagine campus life</title>
    <meta name="description" content="Kaopu helps XJTLU students trade, learn, and connect on campus." />
  </head>
  <body>
    <div class="app-launch-screen" id="boot-screen" aria-label="Kaopu">
      <img class="app-launch-logo" src="/brand/kaopu-mark.svg?v=20260713" alt="" />
      <h1 class="app-launch-title">靠浦</h1>
      <p class="app-launch-subtitle"><span class="launch-en">Reimagine campus life</span><span class="launch-zh">重塑校园生活的可能</span></p>
    </div>
    <script>
      if (document.documentElement.dataset.locale === "zh-CN") {
        document.title = "靠浦 · 重塑校园生活的可能";
        document.querySelector('meta[name="description"]')?.setAttribute("content", "靠浦，为西交利物浦大学学生重塑校园生活的更多可能。");
        document.getElementById("boot-screen")?.setAttribute("aria-label", "靠浦正在启动");
      }
    </script>
    <div id="app">
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
